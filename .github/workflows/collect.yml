name: collect-events

on:
  schedule:
    # GitHub 예약은 UTC 기준이고 수십 분 늦게 돌 때가 있어서,
    # 새벽 1시 Claude 갱신 전에 끝나도록 자정(00:00 KST = 15:00 UTC)에 시작해요.
    - cron: "0 15 * * *"
  workflow_dispatch: {}      # Actions 탭에서 수동 실행

permissions:
  contents: write

concurrency:
  group: collect-events
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: collector/requirements.txt

      - name: Install
        run: |
          pip install -r collector/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Collect
        run: python collector/collect.py

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "data: $(TZ=Asia/Seoul date +%F)" || echo "변경 없음"
          git push
